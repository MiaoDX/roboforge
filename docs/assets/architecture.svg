<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" role="img" aria-labelledby="title desc">
  <title id="title">RoboForge reference architecture</title>
  <desc id="desc">Target architecture, not an implementation status diagram. A versioned experiment feeds two execution modes: lockstep and wall-paced. Robot packages, simulation, and deployment bindings are independent dimensions. Shared traces support capability, deployment, and validity reports, plus a reviewed data and training loop. G2 is the first reference robot and Franka is the planned portability check. Physical robots require wall-paced execution.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
      .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 1.8px; fill: #64748b; }
      .heading { font-size: 30px; font-weight: 700; fill: #0f172a; }
      .label { font-size: 19px; font-weight: 700; fill: #0f172a; }
      .body { font-size: 15px; fill: #475569; }
      .small { font-size: 13px; fill: #64748b; }
      .line { fill: none; stroke: #64748b; stroke-width: 1.6; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="1010" rx="20" fill="#ffffff"/>
  <rect x="1" y="1" width="1198" height="1008" rx="20" fill="none" stroke="#e2e8f0"/>
  <text x="40" y="38" class="eyebrow">ROBOFORGE / REFERENCE ARCHITECTURE</text>
  <rect x="1006" y="22" width="154" height="26" rx="13" fill="#f1f5f9"/>
  <text x="1083" y="40" class="small" text-anchor="middle">DESIGN TARGET</text>
  <text x="40" y="86" class="heading">One experiment. Multiple robots. Two clocks.</text>
  <text x="40" y="114" class="body">Trusted evaluation, data production, and sim-to-hardware continuity.</text>

  <rect x="40" y="145" width="1120" height="90" rx="12" fill="#0f172a"/>
  <text x="64" y="179" font-size="20" font-weight="700" fill="#ffffff">Versioned experiment</text>
  <text x="64" y="209" font-size="15" fill="#cbd5e1">Task + world + robot package + policy + controller + metrics + execution profile</text>
  <path d="M 600 235 V 254 H 314 V 274" class="line"/>
  <path d="M 600 254 H 886 V 274" class="line"/>

  <rect x="40" y="278" width="548" height="174" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="64" y="310" font-size="12" font-weight="700" letter-spacing="1.5" fill="#2563eb">01 / LOCKSTEP</text>
  <text x="64" y="347" class="label">The world waits for inference</text>
  <text x="64" y="378" class="body">Observe · infer · validate action · step</text>
  <text x="64" y="407" class="body">Logical time · batched simulation · debugging</text>
  <text x="64" y="433" class="small">Capability evaluation and data generation</text>

  <rect x="612" y="278" width="548" height="174" rx="12" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="636" y="310" font-size="12" font-weight="700" letter-spacing="1.5" fill="#0f766e">02 / WALL-PACED</text>
  <text x="636" y="347" class="label">The world advances; deadlines count</text>
  <text x="636" y="378" class="body">Async inference + scheduled action execution</text>
  <text x="636" y="407" class="body">Latency · jitter · action expiry · fallback</text>
  <text x="636" y="433" class="small">Deployment SIL, compute HIL, and real-robot profiles</text>

  <path d="M 314 452 V 480" class="line"/>
  <path d="M 886 452 V 480" class="line"/>
  <rect x="40" y="486" width="1120" height="158" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="64" y="516" class="label">Bindings and reusable infrastructure</text>
  <rect x="56" y="534" width="352" height="90" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="72" y="559" font-size="15" font-weight="700" fill="#0f172a">Simulation plant</text>
  <text x="72" y="583" class="small">Isaac Lab + Arena adapter</text>
  <text x="72" y="606" class="small">Isaac Sim / PhysX / RTX</text>
  <rect x="424" y="534" width="352" height="90" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="440" y="559" font-size="15" font-weight="700" fill="#0f172a">Robot packages</text>
  <text x="440" y="583" class="small">G2 reference · Franka portability check</text>
  <text x="440" y="606" class="small">Model + capabilities + instance calibration</text>
  <rect x="792" y="534" width="352" height="90" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="808" y="559" font-size="15" font-weight="700" fill="#0f172a">Deployment boundary</text>
  <text x="808" y="583" class="small">Policy servers · ROS 2 / vendor SDK</text>
  <text x="808" y="606" class="small">Target compute device or physical robot</text>
  <text x="600" y="665" class="small" text-anchor="middle">Clock and deployment topology are independent. Physical plants require wall-paced execution.</text>

  <path d="M 600 677 V 702" class="line"/>
  <rect x="40" y="708" width="1120" height="94" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="64" y="741" class="label">Shared evidence and data contracts</text>
  <text x="64" y="770" class="body">Trace / replay · task evidence · calibration · dataset lineage · asset and data QA</text>
  <text x="1140" y="741" font-size="12" font-weight="700" fill="#0f766e" text-anchor="end">CAPABILITY / DEPLOYMENT / VALIDITY</text>

  <path d="M 600 802 V 829" class="line"/>
  <rect x="40" y="835" width="1120" height="75" rx="12" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="72" y="879" font-size="16" font-weight="700" fill="#0f766e">Evaluate</text>
  <path d="M 168 873 H 214" fill="none" stroke="#0f766e" stroke-width="1.6" marker-end="url(#teal-arrow)"/>
  <text x="239" y="879" font-size="16" font-weight="700" fill="#0f766e">Diagnose</text>
  <path d="M 339 873 H 385" fill="none" stroke="#0f766e" stroke-width="1.6" marker-end="url(#teal-arrow)"/>
  <text x="410" y="879" font-size="16" font-weight="700" fill="#0f766e">Generate + validate data</text>
  <path d="M 617 873 H 663" fill="none" stroke="#0f766e" stroke-width="1.6" marker-end="url(#teal-arrow)"/>
  <text x="688" y="879" font-size="16" font-weight="700" fill="#0f766e">Train</text>
  <path d="M 750 873 H 796" fill="none" stroke="#0f766e" stroke-width="1.6" marker-end="url(#teal-arrow)"/>
  <text x="821" y="879" font-size="16" font-weight="700" fill="#0f766e">Re-evaluate</text>
  <text x="1128" y="879" class="small" text-anchor="end">reviewed loop</text>

  <text x="40" y="945" class="small">Upstream candidates: Genie Sim · SAGE · Blender / SimReady · Mimic / SkillGen · Real2Sim</text>
  <text x="40" y="972" class="small">RoboForge owns experiment semantics and validation — not a new simulator, trainer, or cluster scheduler.</text>
</svg>
